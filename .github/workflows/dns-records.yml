name: dns-records

# Idempotently ensures the Resend sending records for weichao.ren exist in
# Cloudflare DNS. Manual dispatch only; safe to re-run (skips existing).
# Uses the repo's CLOUDFLARE_API_TOKEN — the local wrangler OAuth token has
# zone read only. Zone id is pinned: the token cannot list zones.
on:
  workflow_dispatch:

jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Resend DNS records
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: 302eeca84a58995647e2d792d6d6b51e
        run: |
          set -euo pipefail
          api() { curl -sS -w '\n%{http_code}\n' -H "Authorization: Bearer $CF_TOKEN" "$@"; }

          probe=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID")
          probe_body=$(printf '%s\n' "$probe" | head -n -1)
          probe_code=$(printf '%s\n' "$probe" | tail -n 1)
          echo "zone probe: HTTP $probe_code"
          if [ "$probe_code" != "200" ]; then
            echo "token cannot read the zone; body: $probe_body"
            exit 1
          fi

          ensure() {
            TYPE="$1"; NAME="$2"; CONTENT="$3"; PRIO="${4:-}"
            list=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=$TYPE&name=$NAME")
            list_code=$(printf '%s\n' "$list" | tail -n 1)
            count=$(printf '%s\n' "$list" | head -n -1 | python3 -c "import json,sys; print(len(json.load(sys.stdin)['result']))" 2>/dev/null || echo "?")
            if [ "$list_code" = "200" ] && [ "$count" != "0" ] && [ "$count" != "?" ]; then
              echo "skip ($TYPE $NAME already present)"
              return 0
            fi
            BODY=$(python3 -c "import json; out={'type':'$TYPE','name':'$NAME','content':'$CONTENT','ttl':1,'proxied':False}; out['priority']=int('$PRIO') if '$PRIO' else None; out={k:v for k,v in out.items() if v is not None}; print(json.dumps(out))")
            created=$(api -X POST -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" -d "$BODY")
            created_code=$(printf '%s\n' "$created" | tail -n 1)
            if [ "$created_code" = "200" ]; then echo "created $TYPE $NAME"; else
              echo "FAILED ($created_code) $TYPE $NAME: $(printf '%s\n' "$created" | head -n -1)"
              exit 1
            fi
          }

          ensure TXT "resend._domainkey.weichao.ren" "p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCvPnSWBgkKyFmjJeSsOc4ALes95yoYK2cHb4eHqV+4O6ho4Aft7btFXwJfu4mQkf1r/FsPVWIt6XiFi3o4hWhRbATdclcJzOdZQcfmmzQtdAtxD73kxHB7bVTYSnOsvBORG8ZE0/7UJpv+abj2VytQmAAcs9sAaIa5wiHHOsNo8QIDAQAB"
          ensure MX "send.weichao.ren" "feedback-smtp.us-east-1.amazonses.com" 10
          ensure TXT "send.weichao.ren" "v=spf1 include:amazonses.com ~all"
          ensure CNAME "rsend.weichao.ren" "send.forge.rmta.net"
