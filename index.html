<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef3ef" />
  <meta name="color-scheme" content="light dark" />
  <title>鸭先知 AquaSight</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" />
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <div class="shell">
    <header class="brand">
      <p class="mark">AquaSight</p>
      <h1>鸭先知</h1>
      <p id="meta" class="meta">加载中…</p>
      <p class="meta"><a href="#/review">口味校准</a></p>
      <div class="toolbar">
        <label class="search-wrap">
          <span class="sr">搜索</span>
          <input id="search" type="search" placeholder="搜索标题或概述" autocomplete="off" />
        </label>
        <button id="unread-btn" type="button" class="icon-btn" aria-pressed="false" aria-label="只看未读">未读</button>
        <button id="theme-btn" type="button" class="icon-btn" aria-label="切换主题">主题</button>
        <button id="settings-btn" type="button" class="icon-btn" aria-label="设置">设置</button>
        <button id="refresh-btn" type="button" class="icon-btn" aria-label="刷新">刷新</button>
        <button id="exit-btn" type="button" class="icon-btn" aria-label="退出并清除私人缓存">退出</button>
      </div>
    </header>

    <nav class="nav" aria-label="一级导航">
      <a href="#/featured" data-view="featured">精选</a>
      <a href="#/latest" data-view="latest">最新</a>
      <a href="#/digest" data-view="digest">早报</a>
      <a href="#/saved" data-view="saved">收藏</a>
    </nav>

    <aside class="filters" aria-label="筛选">
      <p class="filter-label">主题</p>
      <div id="topic-filters" class="chips"></div>
      <p class="filter-label">来源</p>
      <div id="source-filters" class="chips"></div>
    </aside>

    <main id="main" class="main" tabindex="-1">
      <p id="banner" class="banner" hidden></p>
      <div id="list" class="list"></div>
      <div id="detail" class="detail" hidden></div>
      <div class="pager">
        <button id="more-btn" type="button" class="text-btn" hidden>加载更多</button>
      </div>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="手机导航">
    <a href="#/featured" data-view="featured">精选</a>
    <a href="#/latest" data-view="latest">最新</a>
    <a href="#/digest" data-view="digest">早报</a>
    <a href="#/saved" data-view="saved">收藏</a>
  </nav>

  <div id="settings" class="detail" hidden>
    <h2>设置与导入</h2>
    <p class="meta">屏蔽来源、降权主题会同步到早报和 Bark（下一轮采集读取）。</p>
    <label class="search-wrap">屏蔽来源（逗号分隔）
      <input id="block-sources" type="text" />
    </label>
    <p><button type="button" id="save-settings" class="text-btn">保存设置</button></p>
    <h3>导入链接</h3>
    <label class="search-wrap">URL
      <input id="import-url" type="url" placeholder="https://" />
    </label>
    <label class="search-wrap">摘录（可选）
      <input id="import-excerpt" type="text" />
    </label>
    <p><button type="button" id="import-btn" class="text-btn">导入</button></p>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
