name: digest

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

concurrency:
  group: pages-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test
        run: npm test
      - name: Restore state from gh-pages
        continue-on-error: true
        run: |
          mkdir -p data
          git fetch origin gh-pages --depth 1 || exit 0
          git show origin/gh-pages:archive.json > data/archive.json || true
          git show origin/gh-pages:digest.json > data/digest.json || true
      - name: Build morning digest
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: node src/digest.js --once
      - name: Stage Pages payload
        run: |
          mkdir -p public
          cp -a web/. public/
          if [ -f data/digest.json ]; then cp data/digest.json public/digest.json; fi
          if [ -f web/digest.json ]; then cp web/digest.json public/digest.json; fi
      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          force_orphan: false
          keep_files: true
