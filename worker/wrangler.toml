name = "aquasight"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "0ba903137afe2104dc7cb1427c2df38d"

# Custom domain on the weichao.ren zone in this account.
# Attaching via custom_domain creates the proxied DNS record and certificate.
# workers_dev must stay true: GitHub Actions ingest posts to the workers.dev URL.
workers_dev = true
routes = [
  { pattern = "quack.weichao.ren", custom_domain = true }
]

[assets]
directory = "../web"
binding = "ASSETS"

# Cron-driven reliability scheduler: when the persisted D1 state shows
# today's digest or a fresh collect snapshot is missing, the Worker
# re-dispatches the existing GitHub workflows via workflow_dispatch.
# Cron triggers are bound to the production env ONLY (no top-level trigger,
# so dev/staging never fire). The handler also requires SCHEDULER_ENABLE=1.
# Secrets/vars (external setup, do NOT commit values):
#   SCHEDULER_ENABLE = "1"            (var — explicit opt-in)
#   GITHUB_DISPATCH_TOKEN             (secret — fine-grained PAT, Actions: write)
#   GITHUB_REPO = "owner/name"        (var)
# Without them /api/v1/scheduler/status reports misconfigured; the scheduler
# never fabricates credentials or reports fake health.
[env.production.triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "aquasight"
database_id = "35459443-cbed-4d42-be8c-436d659bba39"

# Production secrets (dashboard / wrangler secret):
# INGEST_TOKEN, MAIL_API_KEY, MAIL_FROM, AUTH_MODE=otp
# XAI_* stay on GitHub Actions, not on the Worker.

[env.dev]
name = "aquasight-dev"
# Empty: never bind the production custom domain to non-production envs.
routes = []
[env.dev.assets]
directory = "../web"
binding = "ASSETS"
[[env.dev.d1_databases]]
binding = "DB"
database_name = "aquasight-dev"
database_id = "cb2b8ba7-13fc-48a0-a751-5397c4b92635"

[env.staging]
name = "aquasight-staging"
routes = []
[env.staging.assets]
directory = "../web"
binding = "ASSETS"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "aquasight-staging"
database_id = "3d2c0dfb-439f-4e13-8979-ce870517050a"

[env.production]
name = "aquasight"
routes = [{ pattern = "quack.weichao.ren", custom_domain = true }]
[env.production.vars]
SCHEDULER_ENABLE = "0"
GITHUB_REPO = "toolazytoname/AquaSight"

[env.production.assets]
directory = "../web"
binding = "ASSETS"
[[env.production.d1_databases]]
binding = "DB"
database_name = "aquasight"
database_id = "35459443-cbed-4d42-be8c-436d659bba39"
