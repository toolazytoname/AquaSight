<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fafaf8" />
  <meta name="color-scheme" content="light dark" />
  <title>鸭先知 Ponder</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" />
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="#/featured" aria-label="鸭先知首页">
        <span class="brand-name">鸭先知</span>
        <span class="brand-english">Ponder</span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="#/featured" data-view="featured">精选</a>
        <a href="#/latest" data-view="latest">最新</a>
        <a href="#/digest" data-view="digest">早报</a>
        <a href="#/saved" data-view="saved">收藏<span class="nav-count" id="saved-count" hidden></span></a>
      </nav>
      <p class="side-note">值得知道的事，<br>慢慢读。</p>
      <div class="side-footer">
        <button type="button" data-action="settings">阅读设置</button>
        <button type="button" data-action="theme">切换深浅色</button>
        <button type="button" class="account" id="account-btn" data-action="login">
          <span class="avatar" aria-hidden="true">访</span><span id="account-label">登录以同步收藏</span>
        </button>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <a href="#/featured" class="mobile-brand">鸭先知</a>
        <span class="date" id="today-line"></span>
        <div class="tools">
          <button type="button" data-action="search">搜索 <span class="key" aria-hidden="true">/</span></button>
          <button type="button" id="refresh-btn" data-action="refresh">刷新</button>
          <button type="button" data-action="settings">设置</button>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <section class="page-heading" id="feed-heading">
          <div>
            <h1 id="view-title">精选</h1>
            <p id="view-subtitle">从今天的消息里，选出值得读的。</p>
          </div>
          <span class="heading-note" id="meta"></span>
        </section>
        <div class="filters" id="filters-row" aria-label="筛选">
          <div class="tabs" id="topic-filters" aria-label="新闻分类"></div>
          <button type="button" class="filter-trigger" id="filter-trigger" data-action="filter">筛选</button>
        </div>
        <p id="filter-note" class="notice" hidden></p>
        <p id="banner" class="notice" role="status" hidden></p>
        <div id="digest-summary" hidden></div>
        <div id="list" class="feed"></div>
        <article id="detail" class="detail" hidden></article>
        <div class="pager"><button id="more-btn" type="button" class="text-link" hidden>加载更多</button></div>
      </main>
    </div>
  </div>
  <nav class="bottom-nav" aria-label="手机导航">
    <a href="#/featured" data-view="featured">精选</a>
    <a href="#/latest" data-view="latest">最新</a>
    <a href="#/digest" data-view="digest">早报</a>
    <a href="#/saved" data-view="saved">收藏</a>
  </nav>
  <dialog class="dialog" id="modal" aria-label="阅读功能"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
