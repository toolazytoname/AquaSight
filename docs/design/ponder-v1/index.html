{id:'standards',topic:'世界',source:'OpenAI',time:'昨天',title:'AI 标准讨论，正转向如何评估与报告',summary:'一份新的倡议提出，让不同地区的安全评估、报告和治理机制更好地衔接。',full:'OpenAI 发布关于全球 AI 标准的倡议，讨论评估、报告与治理机制之间的协调。',facts:['倡议关注评估与报告方式。','它代表发布方提出的政策主张，不等于已经生效的统一标准。'],url:'https://openai.com/',original:'Building standards for the next phase of AI',context:'跨地区标准能否落地，取决于后续协商和执行细节。应区分倡议、共识与正式规则。'}
];
let saved=new Set(['math','planet']);let filter='全部';let sourceOnly=false;let searchQuery='';let toastTimer;let lastFocus;let previousView='featured';const positions={};let currentRoute='';
const main=document.querySelector('main');const modal=document.querySelector('#modal');
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const navItems=[['featured','精选'],['latest','最新'],['digest','早报'],['saved','收藏']];
function route(){return location.hash.slice(1)||'featured'}
function nav(){const view=route().startsWith('event/')?previousView:route();document.querySelectorAll('.nav,.bottom-nav').forEach(el=>el.innerHTML=navItems.map(([id,title])=>`<a href="#${id}" class="${view===id?'active':''}" ${view===id?'aria-current="page"':''}>${title}${id==='saved'&&el.classList.contains('nav')?`<span class="nav-count">${saved.size}</span>`:''}</a>`).join(''))}
function saveButton(s){return `<button class="save-btn" data-save="${s.id}" aria-label="${saved.has(s.id)?'取消收藏':'收藏'}：${s.title}" aria-pressed="${saved.has(s.id)}"><span class="bookmark" aria-hidden="true"></span></button>`}
function card(s,lead=false){return `<article class="story ${lead?'lead':''}">${lead?'<span class="lead-label">今日关注</span>':''}<div class="story-meta"><span class="topic">${s.topic}</span><span class="sep">·</span><span>${s.source}</span><span class="sep">·</span><time>${s.time}</time></div><h2><a href="#event/${s.id}">${s.title}</a></h2><p>${s.summary}</p>${saveButton(s)}</article>`}
function tabs(){return `<div class="filters"><div class="tabs" aria-label="新闻分类">${['全部','科技','商业','世界'].map(t=>`<button data-filter="${t}" class="${filter===t?'active':''}" aria-pressed="${filter===t}">${t}</button>`).join('')}</div><button class="filter-trigger" data-action="filter">筛选${sourceOnly?' · 1':' ＋'}</button></div>`}
function filtered(list){return list.filter(s=>(filter==='全部'||s.topic===filter)&&(!sourceOnly||s.source==='OpenAI'))}
function feed(view){const isSaved=view==='saved',latest=view==='latest';let list=isSaved?stories.filter(s=>saved.has(s.id)):filtered(stories);const title=isSaved?'收藏':latest?'最新':'精选';const subtitle=isSaved?'留给之后，再仔细读。':latest?'按时间，看看正在发生的事。':'从今天的消息里，选出值得读的。';return `<section class="page-heading"><div><h1>${title}</h1><p>${subtitle}</p></div>${!isSaved?'<span class="heading-note">更新于 09:20</span>':`<button class="text-link" data-action="add">添加链接 ＋</button>`}</section>${isSaved?`<div class="saved-summary"><span>${list.length} 篇 · 保存在这台设备</span><button class="text-link" data-action="login">登录后同步 ↗</button></div>`:tabs()}${sourceOnly&&!isSaved?'<div class="notice">仅显示 OpenAI　<button data-action="clear-filter" class="text-link">清除筛选</button></div>':''}<div class="feed ${latest?'compact':''}">${list.length?list.map((s,i)=>(latest&&(i===0||s.time==='昨天')?`<div class="date-section">${s.time==='昨天'?'昨天 · 9 月 21 日':'今天 · 9 月 22 日'}</div>`:'')+card(s,!latest&&!isSaved&&i===0&&filter==='全部'&&!sourceOnly)).join(''):`<div class="empty"><h2>${isSaved?'值得留住的，放在这里':'这个筛选下还没有内容'}</h2><p>${isSaved?'点一下新闻旁的收藏标记，之后随时回来读。':'试试其他分类，或清除筛选。'}</p><a class="text-link" href="#featured">回到精选 →</a></div>`}</div>${list.length?`<footer class="feed-end"><span>${isSaved?'以上是你的全部收藏':latest?'已看到本轮最新消息':'本轮精选到这里'}</span><a href="#${latest?'featured':'latest'}">${latest?'回到精选':'查看最新'} →</a></footer>`:''}`}
function detail(id){const s=stories.find(s=>s.id===id);if(!s)return '<div class="empty"><h2>这篇内容暂时找不到</h2><a href="#featured">返回精选</a></div>';return `<article class="detail"><a class="back" href="#${previousView}">← 返回${navItems.find(n=>n[0]===previousView)?.[1]||'精选'}</a><div class="story-meta"><span class="topic">${s.topic}</span><span class="sep">·</span><span>${s.source}</span><span class="sep">·</span><span>9 月 22 日 07:20</span></div><h1>${s.title}</h1><div class="detail-actions"><a class="primary" target="_blank" rel="noopener noreferrer" href="${s.url}">阅读来源 ↗</a><button data-detail-save="${s.id}" aria-pressed="${saved.has(s.id)}">${saved.has(s.id)?'已收藏':'收藏'}</button><button data-action="share">分享</button><button data-action="more" data-id="${s.id}" aria-label="更多操作">···</button></div><div class="detail-intro">${s.full}</div><h2>值得留意</h2><ol class="fact-list">${s.facts.map((f,i)=>`<li><span class="fact-num">0${i+1}</span><span>${f}</span></li>`).join('')}</ol><h2>放在背景里看</h2><p>${s.context}</p><div class="source-box"><h2>来源与报道</h2><a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.source}　↗<br>${s.original}</a><small>单一来源 · 来源观点与已验证事实需区分</small></div><details><summary>查看原文信息</summary><p>${s.original}</p><p>部分链接指向媒体首页。本原型不代表已完成逐句来源核验。</p></details><p class="attribution">设计示例：摘要与背景为版式演示文案；正式产品须标明实际整理方式和引用依据。</p><a class="detail-next" href="#event/${stories[(stories.indexOf(s)+1)%stories.length].id}"><small>继续读下一条</small><span>${stories[(stories.indexOf(s)+1)%stories.length].title} →</span></a></article>`}
function digest(){let n=0;return `<article class="edition"><div class="edition-top"><span>2026 年 9 月 22 日 · 星期二</span><button data-action="archive" style="font-size:12px;color:var(--sub);padding:0">往期早报 ↗</button></div><h1>早上好，<br>这是今天值得知道的事。</h1><p class="edition-intro">AI 正在走向更具体的任务：手机开始连接跨应用操作，机器人尝试理解自然语言。与此同时，研究结果如何被审查，也有了新的讨论。</p><div class="edition-info">6 条消息　·　截至北京时间 08:00　·　示例刊期</div>${['科技','商业','世界'].map(t=>`<section class="digest-group"><h2 class="group-heading">${t}</h2>${stories.filter(s=>s.topic===t).map(s=>`<article class="digest-story"><span class="digest-number">${String(++n).padStart(2,'0')}</span><div><h2><a href="#event/${s.id}">${s.title}</a></h2><p>${s.summary}</p><small>${s.source}</small></div></article>`).join('')}</section>`).join('')}<footer class="feed-end"><span>今天的早报读完了。</span><a href="#featured">去看看精选 →</a></footer></article>`}
function render(){let r=route();if(r!==currentRoute)document.querySelector('.toast').hidden=true;if(currentRoute&&r!==currentRoute)positions[currentRoute]=window.scrollY;if(!r.startsWith('event/'))previousView=navItems.some(n=>n[0]===r)?r:'featured';main.innerHTML=r.startsWith('event/')?detail(r.slice(6)):r==='digest'?digest():feed(navItems.some(n=>n[0]===r)?r:'featured');nav();if(r!==currentRoute){window.scrollTo(0,positions[r]||0);currentRoute=r}document.title=`${r.startsWith('event/')?'阅读':navItems.find(n=>n[0]===r)?.[1]||'精选'} · 鸭先知设计原型`}
function notify(text,undo){clearTimeout(toastTimer);const el=document.querySelector('.toast');el.innerHTML=escapeHtml(text)+(undo?'<button id="undo">撤销</button>':'');el.hidden=false;if(undo)document.querySelector('#undo').onclick=()=>{undo();el.hidden=true};toastTimer=setTimeout(()=>el.hidden=true,5000)}
function openDialog(title,body){lastFocus=document.activeElement;modal.innerHTML=`<div class="dialog-heading"><h2>${title}</h2><button class="close" data-close>关闭</button></div>${body}`;modal.showModal()}
function closeDialog(){modal.close();lastFocus?.focus()}
modal.addEventListener('close',()=>lastFocus?.focus());modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
function setTheme(value){document.documentElement.dataset.theme=value==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):value}
function searchResults(q){const found=stories.filter(s=>(s.title+s.summary+s.source).toLowerCase().includes(q.toLowerCase()));document.querySelector('#results').innerHTML=found.length?found.map(s=>`<a class="search-result" data-search-link href="#event/${s.id}">${s.title}<small>${s.source} · ${s.topic}</small></a>`).join(''):'<p>没有找到相关内容，换个关键词试试。</p>'}
function action(name,el){if(name==='theme'){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');return}if(name==='search'){openDialog('搜索新闻','<label class="field-label" for="query">标题、摘要或来源</label><input id="query" type="search" placeholder="搜索你想知道的事" autocomplete="off"><div id="results"></div>');searchResults('');document.querySelector('#query').focus();return}if(name==='settings'){openDialog('阅读设置',`<div class="setting-row"><label for="theme">外观</label><select id="theme"><option value="light" ${document.documentElement.dataset.theme!=='dark'?'selected':''}>浅色</option><option value="dark" ${document.documentElement.dataset.theme==='dark'?'selected':''}>深色</option><option value="system">跟随系统</option></select></div><p class="subhead">内容与来源</p><div class="setting-row"><span>我的内容来源</span><button class="text-link" data-action="sources">管理 →</button></div><div class="setting-row"><span>账户与同步</span><button class="text-link" data-action="login">登录 →</button></div><p>收藏目前保存在本次预览中。原型不连接生产账户。</p><p class="subhead">设计预览</p><button class="text-link" data-action="offline">预览离线提示</button>`);return}if(name==='filter'){openDialog('筛选新闻',`<label class="setting-row"><span>仅看 OpenAI</span><input type="checkbox" id="source-filter" ${sourceOnly?'checked':''}></label><p>筛选只影响当前列表，不改变你的内容偏好。</p><button class="primary" data-action="apply-filter">查看结果</button>`);return}if(name==='apply-filter'){sourceOnly=document.querySelector('#source-filter').checked;closeDialog();render();return}if(name==='clear-filter'){sourceOnly=false;filter='全部';render();return}if(name==='login'){if(modal.open)modal.close();openDialog('把收藏带到另一台设备',`<p>登录后，同步你的收藏和阅读偏好。</p><form id="login-form"><label class="field-label" for="email">邮箱地址</label><input id="email" type="email" required placeholder="you@example.com" autocomplete="email"><button class="primary" type="submit" style="width:100%">获取验证码</button></form><p class="preview-note">流程演示，不会发送邮件或创建账户。</p>`);return}if(name==='share'){openDialog('分享这篇内容',`<p>复制原型内的阅读链接。</p><label class="field-label" for="share-url">页面链接</label><input id="share-url" type="text" readonly value="${escapeHtml(location.href)}"><button class="primary" data-action="copy">复制链接</button>`);return}if(name==='copy'){const input=document.querySelector('#share-url');navigator.clipboard?.writeText(input.value).then(()=>notify('链接已复制')).catch(()=>{input.select();notify('请复制已选中的链接')});if(!navigator.clipboard){input.select();notify('请复制已选中的链接')}return}if(name==='add'){openDialog('添加一条链接','<p>正式产品中，链接将先保存在你的私人收藏里。</p><form id="add-form"><label class="field-label" for="link">网址</label><input id="link" type="text" required placeholder="https://"><button class="primary">预览保存状态</button></form><p class="preview-note">此原型不抓取或上传网页。</p>');return}if(name==='archive'){openDialog('往期早报','<p>本原型提供 9 月 22 日示例刊期。正式产品接入历史数据后，在这里按日期选择。</p><button class="primary" data-close>返回本期</button>');return}if(name==='sources'){if(modal.open)modal.close();openDialog('我的内容来源',`<p>以下开关仅演示偏好设置，不影响示例数据。</p>${['OpenAI','IT之家','量子位','TechCrunch','36氪'].map(s=>`<label class="setting-row"><span>${s}</span><input type="checkbox" checked data-source-setting></label>`).join('')}`);return}if(name==='offline'){closeDialog();main.insertAdjacentHTML('afterbegin','<div class="notice" role="status">现在离线，正在显示已保存的内容。<button class="text-link" data-action="online">恢复在线预览</button></div>');return}if(name==='online'){el.closest('.notice').remove();notify('已恢复在线预览');return}if(name==='more'){openDialog('更多操作',`<div class="sheet-menu"><button data-action="feedback">这条不感兴趣</button><button data-action="correction">反馈内容问题</button></div>`);return}if(name==='feedback'||name==='correction'){closeDialog();notify('已预览反馈状态，未向服务器提交');return}}
document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el)return;if(el.classList.contains('skip')){e.preventDefault();main.focus();return}if(el.hasAttribute('data-close'))return closeDialog();if(el.hasAttribute('data-search-link'))closeDialog();if(el.dataset.filter){filter=el.dataset.filter;render();return}const id=el.dataset.save||el.dataset.detailSave;if(id){const was=saved.has(id);was?saved.delete(id):saved.add(id);render();notify(was?'已取消收藏':'已加入收藏',()=>{was?saved.add(id):saved.delete(id);render()});return}if(el.dataset.action)action(el.dataset.action,el)});
document.addEventListener('input',e=>{if(e.target.id==='query')searchResults(e.target.value)});document.addEventListener('change',e=>{if(e.target.id==='theme')setTheme(e.target.value);if(e.target.hasAttribute('data-source-setting'))notify('偏好状态已预览')});
document.addEventListener('submit',e=>{if(e.target.id==='login-form'){e.preventDefault();const email=document.querySelector('#email').value;modal.innerHTML=`<div class="dialog-heading"><h2>查看你的邮箱</h2><button class="close" data-close>关闭</button></div><p>正式流程会向 ${escapeHtml(email)} 发送验证码。</p><label class="field-label" for="code">6 位验证码</label><input id="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="输入验证码"><button class="primary" data-close style="width:100%">结束流程预览</button><p class="preview-note">未发送邮件，不要输入真实验证码。</p><button class="text-link" data-action="login">修改邮箱</button>`;document.querySelector('#code').focus()}if(e.target.id==='add-form'){e.preventDefault();closeDialog();notify('保存成功状态预览，未抓取链接')}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!modal.open&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();action('search')}});window.addEventListener('hashchange',render);setTheme(new URLSearchParams(location.search).get('theme')||'light');render();
</script>
</body>
