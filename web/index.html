<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鸭先知 AquaSight</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="top">
    <p class="mark">AquaSight</p>
    <h1>鸭先知</h1>
    <p class="sub">春江水暖，破圈置顶。一般事件记在下面。</p>
    <p id="meta" class="meta">加载中…</p>
  </header>

  <main>
    <section class="pane digest" id="digest-pane" aria-labelledby="digest-title">
      <h2 id="digest-title">今日早报</h2>
      <h3>科技</h3>
      <div id="digest-tech"></div>
      <h3>热搜</h3>
      <div id="digest-hot"></div>
      <h3>其它</h3>
      <div id="digest-other"></div>
    </section>
    <section class="pane breaking" aria-labelledby="breaking-title">
      <h2 id="breaking-title">破圈</h2>
      <div id="breaking-list"></div>
    </section>
    <section class="pane normal" aria-labelledby="normal-title">
      <h2 id="normal-title">一般</h2>
      <div id="normal-list"></div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
