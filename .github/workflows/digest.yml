name: digest

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore state from gh-pages
        continue-on-error: true
        run: |
          mkdir -p data
          git fetch origin gh-pages --depth 1 || exit 0
          git show origin/gh-pages:archive.json > data/archive.json || true
          git show origin/gh-pages:digest.json > data/digest.json || true
          git show origin/gh-pages:sent.json > data/sent.json || true
          git show origin/gh-pages:title-zh.json > data/title-zh.json || true
          git show origin/gh-pages:events.json > data/events.json || true
      - name: Build morning digest
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: node src/digest.js --once
      - name: Stage Pages payload
        run: |
          mkdir -p public
          cp -a web/. public/
          rm -f public/events.json
          if [ -f data/events.json ]; then cp data/events.json public/events.json; fi
          if [ -f data/digest.json ]; then cp data/digest.json public/digest.json; fi
          if [ -f web/digest.json ]; then cp web/digest.json public/digest.json; fi
          if [ -f data/archive.json ]; then cp data/archive.json public/archive.json; fi
          if [ -f data/sent.json ]; then cp data/sent.json public/sent.json; fi
          if [ -f data/title-zh.json ]; then cp data/title-zh.json public/title-zh.json; fi
      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          force_orphan: false
