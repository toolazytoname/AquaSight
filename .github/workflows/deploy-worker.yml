name: deploy-worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "dev, staging, or production"
        required: true
        default: "staging"
        type: choice
        options: [dev, staging, production]

permissions:
  contents: read

concurrency:
  group: deploy-worker-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --with-deps
      - run: npm test
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENV: ${{ github.event.inputs.environment }}
        run: |
          case "$DEPLOY_ENV" in
            dev|staging|production) ;;
            *) echo "::error::invalid environment"; exit 1 ;;
          esac
          # Every migration is additive/repeatable; never publish code ahead of schema.
          for migration in worker/migrations/*.sql; do
            npx wrangler d1 execute DB --remote --config worker/wrangler.toml --env "$DEPLOY_ENV" --file "$migration"
          done
          npx wrangler deploy --config worker/wrangler.toml --env "$DEPLOY_ENV"
