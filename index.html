<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef3ef" />
  <meta name="color-scheme" content="light dark" />
  <title>鸭先知 AquaSight</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" />
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <div class="shell">
    <header class="brand">
      <div class="brand-row">
        <div class="brand-title">
          <h1>鸭先知</h1>
          <p id="meta" class="meta">正在打开…</p>
        </div>
        <div class="brand-actions">
          <button id="unread-btn" type="button" class="icon-btn" aria-pressed="false">未读</button>
          <button id="settings-btn" type="button" class="icon-btn" aria-label="设置">设置</button>
        </div>
      </div>
      <div class="toolbar">
        <label class="search-wrap">
          <span class="sr">搜索</span>
          <input id="search" type="search" placeholder="搜索" autocomplete="off" />
        </label>
      </div>
    </header>

    <aside class="sidebar">
      <nav class="nav" aria-label="一级导航">
        <a href="#/featured" data-view="featured">精选</a>
        <a href="#/latest" data-view="latest">最新</a>
        <a href="#/digest" data-view="digest">早报</a>
        <a href="#/saved" data-view="saved">收藏</a>
      </nav>
      <div class="filters" aria-label="筛选">
        <details id="filter-panel">
          <summary>筛选</summary>
          <p class="filter-label">主题</p>
          <div id="topic-filters" class="chips"></div>
          <p class="filter-label">来源</p>
          <div id="source-filters" class="chips"></div>
        </details>
      </div>
    </aside>

    <main id="main" class="main" tabindex="-1">
      <p id="banner" class="banner" hidden></p>
      <div id="list" class="list"></div>
      <div id="detail" class="detail" hidden></div>
      <div class="pager">
        <button id="more-btn" type="button" class="text-btn" hidden>加载更多</button>
      </div>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="手机导航">
    <a href="#/featured" data-view="featured">精选</a>
    <a href="#/latest" data-view="latest">最新</a>
    <a href="#/digest" data-view="digest">早报</a>
    <a href="#/saved" data-view="saved">收藏</a>
  </nav>

  <div id="settings" class="settings-panel" hidden>
    <div class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="settings-head">
        <h2 id="settings-title">设置</h2>
        <button type="button" id="settings-close" class="icon-btn" aria-label="关闭设置">关闭</button>
      </div>
      <p id="settings-note" class="meta">在这台设备上生效。屏蔽来源会在下一轮采集时同步到早报和通知。</p>
      <label class="field">
        <span>外观</span>
        <button id="theme-btn" type="button" class="text-btn">切换深色 / 浅色</button>
      </label>
      <label class="field">屏蔽来源
        <input id="block-sources" type="text" placeholder="例如 hn, weibo" />
      </label>
      <p><button type="button" id="save-settings" class="text-btn primary">保存</button></p>
      <div id="import-block">
        <h3>导入一条链接</h3>
        <label class="field">网址
          <input id="import-url" type="url" placeholder="https://" />
        </label>
        <label class="field">摘录（可选）
          <input id="import-excerpt" type="text" />
        </label>
        <p><button type="button" id="import-btn" class="text-btn">导入</button></p>
      </div>
      <p class="meta"><a href="#/review">口味校准</a></p>
      <div class="settings-foot">
        <button id="refresh-btn" type="button" class="text-btn">重新加载</button>
        <button id="exit-btn" type="button" class="text-btn" aria-label="清除本机缓存">清除本机缓存</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
