name: collect

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore sent.json from gh-pages
        continue-on-error: true
        run: |
          mkdir -p data
          git fetch origin gh-pages --depth 1 || exit 0
          git show origin/gh-pages:sent.json > data/sent.json || true

      - name: Collect once
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/run.js --once

      - name: Stage Pages payload
        run: |
          mkdir -p public
          cp -a web/. public/
          if [ -f data/events.json ]; then cp data/events.json public/events.json; fi
          if [ -f data/sent.json ]; then cp data/sent.json public/sent.json; fi

      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          force_orphan: false
