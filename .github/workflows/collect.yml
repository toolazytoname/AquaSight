name: collect

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: pages-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Test
        run: npm test
      - name: Restore collector state
        uses: actions/cache@v4
        with:
          path: data
          key: aquasight-state-${{ github.run_id }}
          restore-keys: |
            aquasight-state-
      - name: Restore leftover gh-pages state
        continue-on-error: true
        run: |
          mkdir -p data
          git fetch origin gh-pages --depth 1 || exit 0
          [ -f data/sent.json ] || git show origin/gh-pages:sent.json > data/sent.json || true
          [ -f data/archive.json ] || git show origin/gh-pages:archive.json > data/archive.json || true
      - name: Collect once
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_BASE_URL: ${{ secrets.XAI_BASE_URL }}
          XAI_MODEL: ${{ secrets.XAI_MODEL }}
          XAI_USD_PER_MTOK_IN: ${{ secrets.XAI_USD_PER_MTOK_IN }}
          XAI_USD_PER_MTOK_OUT: ${{ secrets.XAI_USD_PER_MTOK_OUT }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: node src/run.js --once
      - name: Ingest to Worker if configured
        continue-on-error: true
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
        run: |
          if [ -n "$INGEST_URL" ] && [ -n "$INGEST_TOKEN" ] && [ -f data/events.json ]; then
            curl -fsS -X POST "$INGEST_URL" \
              -H "Authorization: Bearer $INGEST_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @data/events.json
          else
            echo "ingest skipped: missing INGEST_URL / INGEST_TOKEN"
          fi
      - name: Stage Pages payload
        run: |
          mkdir -p public
          cp -a web/. public/
          if [ -f data/events.json ]; then cp data/events.json public/events.json; fi
          rm -f public/sent.json public/archive.json public/title-zh.json
      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          force_orphan: false
          keep_files: true
