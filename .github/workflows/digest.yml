name: digest

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

concurrency:
  group: pages-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Test
        run: npm test
      - name: Restore collector state
        uses: actions/cache@v4
        with:
          path: data
          key: aquasight-state-${{ github.run_id }}
          restore-keys: |
            aquasight-state-
      - name: Build morning digest
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: node src/digest.js --once
      - name: Ingest digest if configured
        continue-on-error: true
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
        run: |
          if [ -n "$INGEST_URL" ] && [ -n "$INGEST_TOKEN" ] && [ -f data/digest.json ]; then
            python3 -c 'import json; d=json.load(open("data/digest.json")); json.dump({"digest": d}, open("data/ingest-digest.json","w"))'
            curl -fsS --retry 2 --retry-all-errors --max-time 90 -X POST "$INGEST_URL" \
              -H "Authorization: Bearer $INGEST_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @data/ingest-digest.json
          fi
      - name: Stage Pages payload
        run: |
          mkdir -p public
          cp -a web/. public/
          if [ -f data/digest.json ]; then cp data/digest.json public/digest.json; fi
          if [ -f web/digest.json ]; then cp web/digest.json public/digest.json; fi
          rm -f public/sent.json public/archive.json public/title-zh.json
      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          force_orphan: false
          keep_files: true
