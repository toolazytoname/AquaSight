<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f6f3" />
  <meta name="color-scheme" content="light dark" />
  <title>鸭先知 AquaSight</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" />
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <div class="shell">
    <header class="brand">
      <a class="brand-title" href="#/featured" aria-label="鸭先知首页">
        <span class="brand-mark">AQUASIGHT</span>
        <h1>鸭先知</h1>
      </a>
      <div class="toolbar">
        <label class="search-wrap">
          <span class="sr">搜索</span>
          <input id="search" type="search" placeholder="搜索标题或概述" autocomplete="off" />
        </label>
      </div>
      <div class="brand-actions">
        <button id="refresh-btn" type="button" class="icon-btn" aria-label="刷新新闻">刷新</button>
        <button id="settings-btn" type="button" class="icon-btn" aria-label="设置">设置</button>
      </div>
    </header>
    <aside class="sidebar">
      <nav class="nav" aria-label="一级导航">
        <a href="#/featured" data-view="featured">精选</a>
        <a href="#/latest" data-view="latest">最新</a>
        <a href="#/digest" data-view="digest">早报</a>
        <a href="#/saved" data-view="saved">收藏</a>
      </nav>
    </aside>
    <main id="main" class="main" tabindex="-1">
      <div id="feed-heading" class="feed-heading">
        <h2 id="view-title">精选</h2>
        <p id="meta" class="meta">正在打开…</p>
      </div>
      <div class="filters" aria-label="筛选">
        <div id="topic-filters" class="chips topic-tabs" aria-label="主题"></div>
        <div class="filter-toolbar">
          <details id="filter-panel" class="source-picker">
            <summary id="source-label">来源：全部</summary>
            <div id="source-filters" class="chips source-options" aria-label="来源"></div>
          </details>
          <button id="unread-btn" type="button" class="filter-btn" aria-pressed="false">只看未读</button>
          <button id="clear-filters" type="button" class="filter-btn" hidden>清除筛选</button>
        </div>
      </div>
      <p id="banner" class="banner" role="status" hidden></p>
      <p id="sync-status" class="sync-status" role="status" hidden></p>
      <div id="list" class="list"></div>
      <div id="detail" class="detail" hidden></div>
      <div class="pager"><button id="more-btn" type="button" class="text-btn" hidden>加载更多</button></div>
    </main>
  </div>
  <nav class="bottom-nav" aria-label="手机导航">
    <a href="#/featured" data-view="featured">精选</a>
    <a href="#/latest" data-view="latest">最新</a>
    <a href="#/digest" data-view="digest">早报</a>
    <a href="#/saved" data-view="saved">收藏</a>
  </nav>
  <div id="settings" class="settings-panel" hidden>
    <section class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="settings-head">
        <h2 id="settings-title">设置</h2>
        <button type="button" id="settings-close" class="icon-btn" aria-label="关闭设置">关闭</button>
      </div>
      <p id="settings-note" class="meta"></p>
      <p id="enrichment-status" class="settings-status" hidden></p>
      <fieldset class="appearance">
        <legend>外观</legend>
        <label><input type="radio" name="theme" value="system" />跟随系统</label>
        <label><input type="radio" name="theme" value="light" />浅色</label>
        <label><input type="radio" name="theme" value="dark" />深色</label>
      </fieldset>
      <fieldset id="block-sources" class="blocked-sources"><legend>屏蔽来源</legend></fieldset>
      <p><button type="button" id="save-settings" class="text-btn primary">保存设置</button></p>
      <div id="import-block">
        <h3>导入一条链接</h3>
        <label class="field">网址<input id="import-url" type="url" placeholder="https://" /></label>
        <label class="field">摘录（可选）<textarea id="import-excerpt" rows="3" placeholder="粘贴原文中的内容"></textarea></label>
        <p><button type="button" id="import-btn" class="text-btn">导入</button></p>
      </div>
      <a id="review-link" class="settings-link" href="#/review">口味校准 <span aria-hidden="true">→</span></a>
      <details class="local-data">
        <summary>本机数据</summary>
        <p class="meta">清理页面缓存会保留收藏和偏好。</p>
        <div class="settings-foot">
          <button id="exit-btn" type="button" class="text-btn">清除本机缓存</button>
          <button id="reset-data-btn" type="button" class="text-btn danger">重置本机收藏和偏好</button>
        </div>
      </details>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
