name: digest

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

concurrency:
  group: pages-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Restore collector state
        uses: actions/cache@v4
        with:
          path: data
          key: aquasight-state-${{ github.run_id }}
          restore-keys: |
            aquasight-state-
      - name: Build morning digest
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_BASE_URL: ${{ secrets.BARK_BASE_URL }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_BASE_URL: ${{ secrets.XAI_BASE_URL }}
          XAI_MODEL: ${{ secrets.XAI_MODEL }}
          XAI_USD_PER_MTOK_IN: ${{ secrets.XAI_USD_PER_MTOK_IN }}
          XAI_USD_PER_MTOK_OUT: ${{ secrets.XAI_USD_PER_MTOK_OUT }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: node src/digest.js --once
      - name: Ingest digest if configured
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
        run: |
          if [ -z "$INGEST_URL" ] || [ -z "$INGEST_TOKEN" ]; then
            echo "::warning::INGEST_URL/INGEST_TOKEN not set; skipped Worker ingest (Pages fallback only)"
            exit 0
          fi
          if [ ! -f data/digest.json ]; then
            echo "::error::digest build produced no data/digest.json; nothing to publish"
            exit 1
          fi
          python3 -c 'import json; d=json.load(open("data/digest.json")); json.dump({"digest": d}, open("data/ingest-digest.json","w"))'
          curl -fsS --retry 2 --retry-all-errors --max-time 90 -X POST "$INGEST_URL" \
            -H "Authorization: Bearer $INGEST_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @data/ingest-digest.json
      - name: Verify published digest is live
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
        run: |
          if [ -z "$INGEST_URL" ]; then exit 0; fi
          BASE=$(node -e 'process.stdout.write(new URL(process.env.INGEST_URL).origin)')
          WANT_DATE=$(node -e 'try{process.stdout.write(require("./data/digest.json").date||"")}catch{}')
          ok=0
          for i in 1 2 3 4 5 6; do
            GOT=$(curl -fsS --max-time 30 "$BASE/api/v1/digest" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=(JSON.parse(s).digest)||{};if((j.items||[]).length)process.stdout.write(j.date||"")}catch{}})' || echo "")
            if [ -n "$WANT_DATE" ] && [ "$GOT" == "$WANT_DATE" ]; then
              echo "published digest verified for $GOT"
              ok=1; break
            fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::live digest check failed after ingest (want $WANT_DATE, got ${GOT:-none})"
            exit 1
          fi
      - name: Stage Pages payload
        run: |
          mkdir -p public
          cp -a web/. public/
          if [ -f data/digest.json ]; then cp data/digest.json public/digest.json; fi
          if [ -f web/digest.json ]; then cp web/digest.json public/digest.json; fi
          rm -f public/sent.json public/archive.json public/title-zh.json
      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          force_orphan: false
          keep_files: true
      - name: Alert on failure
        if: failure()
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_BASE_URL: ${{ secrets.BARK_BASE_URL }}
        run: |
          if [ -n "$BARK_KEY" ]; then
            BASE="${BARK_BASE_URL:-https://api.day.app}"
            curl -fsS --max-time 20 -X POST "$BASE/$BARK_KEY" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d '{"title":"鸭先知早报失败","body":"digest 工作流未跑完，请检查 GitHub Actions。","group":"aquasight"}' || true
          fi
