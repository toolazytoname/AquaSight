name = "aquasight"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "0ba903137afe2104dc7cb1427c2df38d"

[assets]
directory = "../web"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "aquasight"
